name: Steel News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

concurrency:
  group: steel-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run steel news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python steel_news_bot.py

      - name: Commit updated state file
        if: ${{ success() }}
        run: |
          git config user.name "steel-news-bot"
          git config user.email "actions@github.com"
          git add sent_links.json
          git diff --cached --quiet || git commit -m "update sent links"
          git push

      - name: Send workflow error alert to Telegram
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT_ID="${TELEGRAM_ADMIN_CHAT_ID:-$TELEGRAM_CHAT_ID}"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram error alert skipped: missing Telegram secret(s)."
            exit 0
          fi

          LOG_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          TEXT="🚨 <b>خطای ربات کران فولاد</b>%0A%0Aاجرای GitHub Actions با خطا متوقف شد.%0A%0A<b>Workflow:</b> ${GITHUB_WORKFLOW}%0A<b>Run:</b> #${GITHUB_RUN_NUMBER}%0A<b>Repository:</b> ${GITHUB_REPOSITORY}%0A%0A<a href=\"${LOG_URL}\">مشاهده لاگ اجرا</a>"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
