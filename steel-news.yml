name: Steel News Bot

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, offset from the top of the hour to reduce GitHub load.
    - cron: "2-59/5 * * * *"

concurrency:
  group: steel-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run steel news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python steel_news_bot.py

      - name: Commit updated state file
        if: ${{ success() }}
        run: |
          git config user.name "steel-news-bot"
          git config user.email "actions@github.com"
          git add sent_links.json
          git diff --cached --quiet || git commit -m "update sent links"
          git push

      - name: Send workflow error alert to Telegram
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CHAT_ID="${TELEGRAM_ADMIN_CHAT_ID:-$TELEGRAM_CHAT_ID}"

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram error alert skipped: missing Telegram secret(s)."
            exit 0
          fi

          LOG_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl --fail-with-body --silent --show-error             --connect-timeout 10             --max-time 30             -X POST             "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             -d "chat_id=${CHAT_ID}"             --data-urlencode "text=🚨 خطای ربات کران فولاد

اجرای GitHub Actions با خطا متوقف شد.

Workflow: ${GITHUB_WORKFLOW}
Run: #${GITHUB_RUN_NUMBER}
Repository: ${GITHUB_REPOSITORY}

مشاهده لاگ: ${LOG_URL}"             -d "disable_web_page_preview=true"
